# CloudPanel → Sites → drive.wooki.cloud → Vhost 에 넣을 내용.
# CloudPanel 이 만든 "Reverse Proxy" 사이트(대상 http://127.0.0.1:7400)의 vhost 를 기준으로,
# 아래 ① 은 server { … } (443) 블록 안에, ② 는 location / { … } 블록 안에 추가·교체한다.

# ── ① server 블록 ──

# Cloudflare 를 거쳐 오므로 실제 방문자 IP 복원 (안 하면 gateway rate limit 이 모두를 Cloudflare IP 하나로 본다).
# 목록은 https://www.cloudflare.com/ips/ 와 대조할 것. CloudPanel 이 이미 전역으로 설정해 두었다면 생략.
real_ip_header CF-Connecting-IP;
set_real_ip_from 173.245.48.0/20;
set_real_ip_from 103.21.244.0/22;
set_real_ip_from 103.22.200.0/22;
set_real_ip_from 103.31.4.0/22;
set_real_ip_from 141.101.64.0/18;
set_real_ip_from 108.162.192.0/18;
set_real_ip_from 190.93.240.0/20;
set_real_ip_from 188.114.96.0/20;
set_real_ip_from 197.234.240.0/22;
set_real_ip_from 198.41.128.0/17;
set_real_ip_from 162.158.0.0/15;
set_real_ip_from 104.16.0.0/13;
set_real_ip_from 104.24.0.0/14;
set_real_ip_from 172.64.0.0/13;
set_real_ip_from 131.0.72.0/22;
set_real_ip_from 2400:cb00::/32;
set_real_ip_from 2606:4700::/32;
set_real_ip_from 2803:f800::/32;
set_real_ip_from 2405:b500::/32;
set_real_ip_from 2405:8100::/32;
set_real_ip_from 2a06:98c0::/29;
set_real_ip_from 2c0f:f248::/32;

# 업로드 청크 32MB + 여유 (Cloudflare 무료 플랜은 요청당 100MB)
client_max_body_size 40m;

# ── ② location / 블록 ──
#
#   proxy_pass http://127.0.0.1:7400;
#   proxy_http_version 1.1;
#   proxy_set_header Host $host;
#   proxy_set_header X-Forwarded-For $remote_addr;      # real_ip 로 복원된 방문자 IP 하나만
#   proxy_set_header X-Forwarded-Proto $scheme;
#
#   # SD카드에 임시 파일을 쓰지 않도록: 업로드·다운로드를 버퍼링하지 않고 그대로 흘려보낸다
#   proxy_request_buffering off;
#   proxy_buffering off;
#   proxy_max_temp_file_size 0;
#
#   # 큰 폴더 zip·느린 회선 대비 (Cloudflare 자체 제한은 약 100초 무응답)
#   proxy_read_timeout 300s;
#   proxy_send_timeout 300s;
